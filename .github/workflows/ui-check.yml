name: UI Check

on:
  push:
    branches: [main, ui-v3, abilities-v3-1, premium-v3-2, abilities-v3-3, fix-jina-search-v3-3, ui-polish-v3-4, migration/nexal-ai-extract-20260822, work/nexal-ai-v3.5-context-engine-20260822, work/nexal-ai-v3.6-local-project-lens-20260822]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s augment.js
          test -s search-tools.js
          test -s workspace-tools.js
          test -s python-lab.js
          test -s python-worker.js
          test -s repo-tools.js
          test -s prompt-budget.js
          test -s prompt-budget.test.mjs
          test -s context-engine.js
          test -s context-engine.test.mjs
          test -s project-tools.js
          test -s project-tools.test.mjs
          test -s augmentation-integration.test.mjs
          test -s ui-polish.js
          test -s manifest.webmanifest
          test -s service-worker.js
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check augment.js
          node --check search-tools.js
          node --check workspace-tools.js
          node --check python-lab.js
          node --check python-worker.js
          node --check repo-tools.js
          node --check prompt-budget.js
          node --check prompt-budget.test.mjs
          node --check context-engine.js
          node --check context-engine.test.mjs
          node --check project-tools.js
          node --check project-tools.test.mjs
          node --check augmentation-integration.test.mjs
          node --check ui-polish.js
          node --check service-worker.js
      - name: Test prompt budget behavior
        run: node prompt-budget.test.mjs
      - name: Test Context Engine behavior
        run: node context-engine.test.mjs
      - name: Test Local Project Lens behavior
        run: node project-tools.test.mjs
      - name: Test augmented prompt integration
        run: node augmentation-integration.test.mjs