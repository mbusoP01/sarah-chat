name: UI Check

on:
  push:
    branches: [main, ui-v3, abilities-v3-1, premium-v3-2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s augment.js
          test -s workspace-tools.js
          test -s python-lab.js
          test -s python-worker.js
          test -s manifest.webmanifest
          test -s service-worker.js
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check augment.js
          node --check workspace-tools.js
          node --check python-lab.js
          node --check python-worker.js
          node --check service-worker.js
